# Nautilus Scripts Workflow Add New Script Workflow

## Action

Follow the add-new-script-workflow workflow:
1. Create new script file in appropriate category directory (e.g., Document/PDF: Tools/...)
2. Add i18n message for the new script in all .po translation files
3. Add or update tests for the new script in .helpers/.unit-tests-scripts.sh
4. Bump version in .common-functions.sh and install.sh

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: Document/PDF: Tools/*, .po/*.po, .po/en_template.pot

